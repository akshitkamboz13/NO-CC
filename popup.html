<!DOCTYPE html>
<html>
<head>
<style>
:root{color-scheme:light dark;--bg:#f6f7ff;--card:#fff;--text:#1f2937;--muted:#8b90a5;--border:#e8eaf7;--row-bg:#f3f4ff;--pill:#f3f4ff;--pill-hover:#e9ebff;--yes:#22c55e;--yes-soft:#dcfce7;--yes-text:#15803d;--no:#ef4444;--no-soft:#fee2e2;--no-text:#b91c1c;--shadow:0 10px 24px rgba(91,83,180,.16);--tree:#d6d8ee}
@media(prefers-color-scheme:dark){
:root{--bg:#111218;--card:#1a1c26;--text:#f4f5ff;--muted:#7a7f9a;--border:#2b2f45;--row-bg:#1f2233;--pill:#22263a;--pill-hover:#2b3150;--yes:#22c55e;--yes-soft:#14532d;--yes-text:#86efac;--no:#ef4444;--no-soft:#450a0a;--no-text:#fca5a5;--shadow:0 14px 30px rgba(0,0,0,.45);--tree:#3f435d}
}
*{margin:0;padding:0;box-sizing:border-box}
body{width:280px;padding:12px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}

.hdr{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#818cf8,#a78bfa);box-shadow:0 0 8px rgba(139,92,246,.4)}
.title{font-size:15px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:10.5px;margin-bottom:10px}

/* Single-line question row */
.q{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--row-bg);border-radius:10px;padding:7px 10px;margin-bottom:5px;transition:opacity .2s,max-height .25s ease,padding .25s ease,margin .25s ease;overflow:hidden;max-height:40px}
.q.l1{margin-left:0}
.q.l2{margin-left:14px;position:relative}
.q.l3{margin-left:28px;position:relative}

/* Tree connectors */
.q.l2::before,.q.l3::before{content:"";position:absolute;left:-7px;top:0;height:50%;width:1px;background:var(--tree)}
.q.l2::after,.q.l3::after{content:"";position:absolute;left:-7px;top:50%;width:6px;height:1px;background:var(--tree)}
.q.l3::before{left:-7px}
.q.l3::after{left:-7px}

.q-text{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}

/* Yes / No pill pair */
.yn{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex-shrink:0}
.yn button{border:none;padding:3px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:all .12s ease;outline:none;background:transparent;color:var(--muted)}
.yn button:first-child{border-right:1px solid var(--border)}
.yn .y.on{background:var(--yes-soft);color:var(--yes-text)}
.yn .n.on{background:var(--no-soft);color:var(--no-text)}
.yn button:hover:not(.on){background:var(--row-bg);color:var(--text)}

/* Collapse animation */
.q.hide{max-height:0;padding-top:0;padding-bottom:0;margin-bottom:0;opacity:0;pointer-events:none;border:none}

/* Links */
.links{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);display:flex;gap:5px;justify-content:center}
.links a{color:var(--muted);font-size:10px;text-decoration:none;background:var(--pill);padding:4px 8px;border-radius:999px;border:1px solid var(--border);transition:background .15s,transform .15s,color .15s}
.links a:hover{background:var(--pill-hover);color:var(--text);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="card">
	<div class="hdr"><span class="dot"></span><span class="title">No CC</span></div>
	<div class="sub">Captions control, zero noise</div>

	<div class="q l1" id="q-root">
		<span class="q-text">Enable extension?</span>
		<div class="yn">
			<button class="y" data-key="enabled" data-val="true">Yes</button>
			<button class="n" data-key="enabled" data-val="false">No</button>
		</div>
	</div>
	<div class="q l2" id="q-nocc">
		<span class="q-text">Hide captions?</span>
		<div class="yn">
			<button class="y" data-key="noCcEnabled" data-val="true">Yes</button>
			<button class="n" data-key="noCcEnabled" data-val="false">No</button>
		</div>
	</div>
	<div class="q l3" id="q-longform">
		<span class="q-text">Long-form videos?</span>
		<div class="yn">
			<button class="y" data-key="longForm" data-val="true">Yes</button>
			<button class="n" data-key="longForm" data-val="false">No</button>
		</div>
	</div>
	<div class="q l3" id="q-shorts">
		<span class="q-text">On Shorts?</span>
		<div class="yn">
			<button class="y" data-key="shorts" data-val="true">Yes</button>
			<button class="n" data-key="shorts" data-val="false">No</button>
		</div>
	</div>
	<div class="q l3" id="q-previews">
		<span class="q-text">On previews?</span>
		<div class="yn">
			<button class="y" data-key="previews" data-val="true">Yes</button>
			<button class="n" data-key="previews" data-val="false">No</button>
		</div>
	</div>

	<div class="links">
		<a href="https://www.si4k.online/projects/no-cc" target="_blank">Home</a>
		<a href="https://www.si4k.online/projects/no-cc/privacy" target="_blank">Privacy</a>
		<a href="https://www.si4k.online/contribution" target="_blank">Contribute</a>
	</div>
</div>
<script src="popup.js"></script>
</body>
</html>

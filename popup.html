<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:140px;padding:16px;font-family:system-ui;background:#1a1a1a;color:#fff}
.wrap{display:flex;align-items:center;justify-content:space-between}
.label{font-size:14px;font-weight:600}
.toggle{position:relative;width:44px;height:24px}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#444;border-radius:24px;cursor:pointer;transition:.2s}
.slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.slider{background:#4ade80}
input:checked+.slider:before{transform:translateX(20px)}
</style>
</head>
<body>
<div class="wrap">
<span class="label">No CC</span>
<label class="toggle"><input type="checkbox" id="t"><span class="slider"></span></label>
</div>
<script src="popup.js"></script>
</body>
</html>

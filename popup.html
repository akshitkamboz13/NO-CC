<!DOCTYPE html>
<html>
<head>
<style>
:root {
	color-scheme: light dark;
	/* Light Theme Colors (Premium Clean) */
	--bg: #f8fafc;
	--card-bg: #ffffff;
	--text-main: #0f172a;
	--text-sub: #64748b;
	--border: #f1f5f9;
	--track: #f1f5f9;
	--pill-bg: #ffffff;
	--pill-shadow: 0 2px 6px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
	--yes-color: #10b981;
	--no-color: #ef4444;
	--card-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.08), 0 4px 12px -4px rgba(15, 23, 42, 0.04);
	--hover-bg: #f8fafc;
	--inner-border: #e2e8f0;
}
@media (prefers-color-scheme: dark) {
:root {
	/* Dark Theme Colors (Deep OLED/Slate) */
	--bg: #0b0c10;
	--card-bg: #14161f;
	--text-main: #f8fafc;
	--text-sub: #8b95a8;
	--border: #1f2230;
	--track: #0f1118;
	--pill-bg: #202433;
	--pill-shadow: 0 4px 10px rgba(0,0,0,0.3);
	--yes-color: #34d399;
	--no-color: #f87171;
	--card-shadow: 0 16px 40px rgba(0,0,0,0.6);
	--hover-bg: #1a1d29;
	--inner-border: #262a3b;
}
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
	width: 280px;
	padding: 16px;
	font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
	background: var(--bg);
	color: var(--text-main);
	-webkit-font-smoothing: antialiased;
}

/* Header Section */
.header {
	display: flex;
	align-items: center;
	gap: 12px;
	margin-bottom: 16px;
	padding: 0 4px;
}
.header-icon {
	width: 32px;
	height: 32px;
	border-radius: 10px;
	background: linear-gradient(135deg, #818cf8, #a78bfa);
	display: flex;
	align-items: center;
	justify-content: center;
	box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
}
.header-icon svg {
	width: 18px;
	height: 18px;
	fill: none;
	stroke: #ffffff;
	stroke-width: 2;
	stroke-linecap: round;
	stroke-linejoin: round;
}
.header-text {
	display: flex;
	flex-direction: column;
}
.title {
	font-size: 16px;
	font-weight: 700;
	letter-spacing: -0.3px;
	line-height: 1.1;
}
.sub {
	color: var(--text-sub);
	font-size: 11.5px;
	font-weight: 500;
	margin-top: 2px;
}

/* Accordion Card (the main container for settings) */
.settings-card {
	background: var(--card-bg);
	border-radius: 16px;
	box-shadow: var(--card-shadow);
	border: 1px solid var(--border);
	overflow: hidden;
}

/* Individual Rows */
.row {
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 12px 14px;
	position: relative;
	transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
	overflow: hidden;
	max-height: 52px;
}

/* Seamless inner dividers */
.row:not(:last-child)::after {
	content: "";
	position: absolute;
	bottom: 0;
	left: 14px;
	right: 14px;
	height: 1px;
	background: var(--inner-border);
	transition: opacity 0.2s;
}

/* Indentation for children */
.l2 { transform: translateX(0); }
.l2 .row-label { padding-left: 12px; }

.l3 { transform: translateX(0); }
.l3 .row-label { padding-left: 24px; color: var(--text-sub); }
.l3 .row-label::before {
	content: "";
	position: absolute;
	left: 12px;
	top: 50%;
	width: 6px;
	height: 1px;
	background: var(--text-sub);
	opacity: 0.3;
}

.row-label {
	font-size: 13px;
	font-weight: 600;
	white-space: nowrap;
	position: relative;
}

/* iOS Style Segmented Control (Yes/No Pills) */
.yn {
	display: inline-flex;
	background: var(--track);
	border-radius: 8px;
	padding: 2px;
	border: 1px solid var(--border);
}
.yn button {
	border: none;
	background: transparent;
	padding: 5px 12px;
	font-size: 11px;
	font-weight: 700;
	color: var(--text-sub);
	border-radius: 6px;
	cursor: pointer;
	transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
	outline: none;
}
.yn .y.on {
	background: var(--pill-bg);
	color: var(--yes-color);
	box-shadow: var(--pill-shadow);
}
.yn .n.on {
	background: var(--pill-bg);
	color: var(--no-color);
	box-shadow: var(--pill-shadow);
}
.yn button:not(.on):hover {
	color: var(--text-main);
}

/* Collapse animations */
.q.hide {
	max-height: 0;
	padding-top: 0;
	padding-bottom: 0;
	opacity: 0;
	pointer-events: none;
}
/* Hide the bottom border of the element *above* a hidden element to prevent double borders
   Actually, the simplest way is to hide the after border of hidden elements */
.q.hide::after {
	opacity: 0;
}

/* Footer Links */
.footer-links {
	display: flex;
	justify-content: center;
	gap: 12px;
	margin-top: 16px;
}
.footer-links a {
	color: var(--text-sub);
	font-size: 11px;
	font-weight: 500;
	text-decoration: none;
	transition: color 0.15s;
}
.footer-links a:hover {
	color: var(--text-main);
}
</style>
</head>
<body>

<div class="header">
	<div class="header-icon">
		<!-- Minimalist closed-captions slash icon -->
		<svg viewBox="0 0 24 24">
			<path d="M4 8h16v8H4z" />
			<path d="M3 3l18 18" />
		</svg>
	</div>
	<div class="header-text">
		<div class="title">No CC</div>
		<div class="sub">Captions control, zero noise</div>
	</div>
</div>

<div class="settings-card">
	<div class="row q l1" id="q-root">
		<span class="row-label">Enable extension</span>
		<div class="yn">
			<button class="y" data-key="enabled" data-val="true">Yes</button>
			<button class="n" data-key="enabled" data-val="false">No</button>
		</div>
	</div>
	
	<div class="row q l2" id="q-nocc">
		<span class="row-label">Hide captions</span>
		<div class="yn">
			<button class="y" data-key="noCcEnabled" data-val="true">Yes</button>
			<button class="n" data-key="noCcEnabled" data-val="false">No</button>
		</div>
	</div>
	
	<div class="row q l3" id="q-longform">
		<span class="row-label">Long-form</span>
		<div class="yn">
			<button class="y" data-key="longForm" data-val="true">Yes</button>
			<button class="n" data-key="longForm" data-val="false">No</button>
		</div>
	</div>
	
	<div class="row q l3" id="q-shorts">
		<span class="row-label">Shorts</span>
		<div class="yn">
			<button class="y" data-key="shorts" data-val="true">Yes</button>
			<button class="n" data-key="shorts" data-val="false">No</button>
		</div>
	</div>
	
	<div class="row q l3" id="q-previews">
		<span class="row-label">Previews</span>
		<div class="yn">
			<button class="y" data-key="previews" data-val="true">Yes</button>
			<button class="n" data-key="previews" data-val="false">No</button>
		</div>
	</div>
</div>

<div class="footer-links">
	<a href="https://www.si4k.online/projects/no-cc" target="_blank">Home</a>
	<a href="https://www.si4k.online/projects/no-cc/privacy" target="_blank">Privacy</a>
	<a href="https://www.si4k.online/contribution" target="_blank">Contribute</a>
</div>

<script src="popup.js"></script>
</body>
</html>

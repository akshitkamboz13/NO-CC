<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:160px;padding:16px;font-family:system-ui,-apple-system,sans-serif;background:#1a1a1a;color:#fff}
.wrap{display:flex;align-items:center;justify-content:space-between}
.label{font-size:14px;font-weight:600}
.toggle{position:relative;width:44px;height:24px}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#444;border-radius:24px;cursor:pointer;transition:background .15s ease-out}
.slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .15s cubic-bezier(.4,0,.2,1)}
input:checked+.slider{background:#4ade80}
input:checked+.slider:before{transform:translateX(20px)}
.links{margin-top:12px;padding-top:10px;border-top:1px solid #333;display:flex;gap:12px;justify-content:center}
.links a{color:#888;font-size:11px;text-decoration:none;transition:color .15s ease}
.links a:hover{color:#fff}
</style>
</head>
<body>
<div class="wrap">
<span class="label">No CC</span>
<label class="toggle"><input type="checkbox" id="t"><span class="slider"></span></label>
</div>
<div class="links">
<a href="https://www.si4k.online/projects/no-cc" target="_blank">Home</a>
<a href="https://www.si4k.online/projects/no-cc/privacy" target="_blank">Privacy</a>
</div>
<script src="popup.js"></script>
</body>
</html>
